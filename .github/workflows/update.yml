name: Update site
on:
  schedule:
    - cron: "20 */2 * * *"   # every 2 hours: picks up the new YouTube upload
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube id just uploaded (sent by the DailyBharat VPS); added even if the feed has not listed it yet"
        required: false
  push:
    branches: [main]
    paths: [build.py, translate.py, "content/**", "assets/style.css", "assets/site.js"]
permissions:
  contents: write
concurrency:
  group: update-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest videos and rebuild pages
        env:
          EXTRA_VIDEO_ID: ${{ inputs.video_id }}
        run: python build.py
      - name: Translate new videos to English (only if GEMINI_API_KEY secret is set)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python translate.py
      - name: Rebuild with translations
        run: python build.py
      - name: Commit if anything changed
        run: |
          git config user.name "dailybharat-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update videos $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
