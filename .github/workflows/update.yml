name: Update site
on:
  schedule:
    - cron: "20 */2 * * *"   # every 2 hours: picks up the new YouTube upload
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, "content/**", "assets/style.css", "assets/site.js"]
permissions:
  contents: write
concurrency:
  group: update-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest videos and rebuild pages
        run: python build.py
      - name: Commit if anything changed
        run: |
          git config user.name "dailybharat-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update videos $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
